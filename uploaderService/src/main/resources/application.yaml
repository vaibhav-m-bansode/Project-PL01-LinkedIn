spring:
  application:
    name: uploader-service

server:
  port: 9050
  servlet:
    context-path: /uploader

eureka:
  client:
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka

my_cloud_name: ${MY_CLOUD_NAME}
my_api_secret: ${MY_API_SECRETE}
my_api_key: ${MY_API_KEY}
gcp:
  bucket-name: project-linkedin-01
