spring:
  application:
    name: post-service
  datasource:
    url: jdbc:postgresql://localhost:5432/UserDB
    username: postgres
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: 9020
  servlet:
    context-path: /posts
eureka:
  client:
    register-with-eureka: true
    service-url:
      defaultZone : http://localhost:8761/eureka
